{# Lienzo estratégico (océano azul) en SVG: una línea por competidor y OneCore en verde continuo. #}
{% macro lienzo(svg) %}{% if svg %}
<figure class="bm-lienzo">
  <svg viewBox="0 0 {{ svg.ancho }} {{ svg.alto }}" role="img" aria-label="Lienzo estratégico: calificación de 1 a 5 por factor">
    {% for v, y in svg.niveles %}<line x1="{{ svg.izq }}" x2="{{ svg.der }}" y1="{{ y }}" y2="{{ y }}" class="bm-grid"/><text x="{{ svg.izq - 10 }}" y="{{ y + 4 }}" class="bm-y">{{ v }}</text>{% endfor %}
    {% for x in svg.ejes %}<line x1="{{ x }}" x2="{{ x }}" y1="{{ svg.niveles[-1][1] }}" y2="{{ svg.base }}" class="bm-eje"/>
      <foreignObject x="{{ x - 55 }}" y="{{ svg.base + 6 }}" width="110" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="bm-x">{{ svg.etiquetas[loop.index0] }}</div></foreignObject>{% endfor %}
    {% for l in svg.lineas %}
      <polyline points="{% for x, y in l.pts %}{{ x }},{{ y }} {% endfor %}" fill="none" stroke="{{ l.color }}" stroke-width="{{ 2 if l.punteada else 3.5 }}" {% if l.punteada %}stroke-dasharray="6 4"{% endif %} stroke-linejoin="round"/>
      {% for x, y in l.pts %}<circle cx="{{ x }}" cy="{{ y }}" r="{{ 3.5 if l.punteada else 5 }}" fill="{{ l.color }}"/>{% endfor %}
    {% endfor %}
  </svg>
  <figcaption class="bm-ley">{% for l in svg.lineas|reverse %}<span><i style="background:{{ l.color }}{{ ';opacity:.85' if l.punteada }}"></i>{{ l.nombre }}</span>{% endfor %}<span class="muted">1 = débil · 5 = fuerte</span></figcaption>
</figure>
{% else %}<span class="small muted">Aún no hay factores calificados.</span>{% endif %}{% endmacro %}
