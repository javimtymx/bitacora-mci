{# Lienzo estratégico (océano azul) en SVG: una línea por competidor y OneCore en verde continuo. #}
{% macro lienzo(svg) %}{% if svg %}
<figure class="bm-lienzo">
  <svg viewBox="0 0 {{ svg.ancho }} {{ svg.alto }}" role="img" aria-label="Lienzo estratégico: calificación de 1 a 5 por factor">
    {% for v, y in svg.niveles %}<line x1="{{ svg.izq }}" x2="{{ svg.der }}" y1="{{ y }}" y2="{{ y }}" class="bm-grid"/><text x="{{ svg.izq - 10 }}" y="{{ y + 4 }}" class="bm-y">{{ v }}</text>{% endfor %}
    {% for x in svg.ejes %}<line x1="{{ x }}" x2="{{ x }}" y1="{{ svg.niveles[-1][1] }}" y2="{{ svg.base }}" class="bm-eje"/>
      {% if svg.numerado %}<g class="bm-xn" data-factor="{{ svg.claves[loop.index0] }}" tabindex="0" role="button"><title>{{ loop.index }}. {{ svg.etiquetas[loop.index0] }} — clic para ver el detalle</title><circle cx="{{ x }}" cy="{{ svg.base + 16 }}" r="10"/><text x="{{ x }}" y="{{ svg.base + 20 }}">{{ loop.index }}</text></g>
      {% else %}<foreignObject x="{{ x - 55 }}" y="{{ svg.base + 6 }}" width="110" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="bm-x bm-xclick" data-factor="{{ svg.claves[loop.index0] }}">{{ svg.etiquetas[loop.index0] }}</div></foreignObject>{% endif %}{% endfor %}
    {% for l in svg.lineas %}
      <polyline points="{% for x, y in l.pts %}{{ x }},{{ y }} {% endfor %}" fill="none" stroke="{{ l.color }}" stroke-width="{{ 2 if l.punteada else 3.5 }}" {% if l.punteada %}stroke-dasharray="6 4"{% endif %} stroke-linejoin="round"/>
      {% for p in l.det %}<circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ 3.5 if l.punteada else 5 }}" fill="{{ l.color }}" class="bm-pt" data-factor="{{ p.k }}" tabindex="0" role="button" aria-label="{{ l.nombre }} · {{ p.f }}: {{ '%g'|format(p.v) }} de 5"><title>{{ l.nombre }} · {{ p.f }}: {{ '%g'|format(p.v) }}/5 — clic para ver el detalle</title></circle>{% endfor %}
    {% endfor %}
  </svg>
  {% if svg.numerado %}<ol class="bm-fact">{% for d in svg.detalle %}<li data-factor="{{ svg.claves[loop.index0] }}" tabindex="0" role="button" title="Ver qué hace mejor el competidor y cómo competir"><span class="bm-fn">{{ d.n }}</span><span class="bm-fnom">{{ d.nombre }}</span>
    <span class="bm-fval" title="OneCore contra el mejor competidor en este factor">{% if d.onecore is not none %}<b style="color:#0F766E">OneCore {{ '%g'|format(d.onecore) }}</b>{% endif %}{% if d.mejor %} · {{ d.mejor.nombre }} {{ '%g'|format(d.mejor.valor) }}{% endif %}{% if d.brecha is not none and d.brecha < 0 %} <span class="bm-gap">−{{ '%g'|format(-d.brecha) }}</span>{% endif %}</span></li>{% endfor %}</ol>{% endif %}
  <div class="bm-tip" hidden></div>
  <figcaption class="bm-ley">{% for l in svg.lineas|reverse %}<span><i style="background:{{ l.color }}{{ ';opacity:.85' if l.punteada }}"></i>{{ l.nombre }}</span>{% endfor %}<span class="muted">1 = débil · 5 = fuerte · pasa el cursor por un punto para ver el proveedor; clic en un punto o en el número del factor para ver el detalle</span></figcaption>
</figure>
<div class="overlay" id="fx-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="fx-t" style="max-width:920px">
  <div class="mh"><span class="small muted">Lienzo estratégico</span><button class="btn ghost" type="button" data-close aria-label="Cerrar" style="width:42px;padding:0">✕</button></div>
  <div class="sec fx-cuerpo" style="border-top:0" id="fx-cuerpo"></div></div></div>
<button type="button" data-open="fx-modal" id="fx-abrir" hidden></button>
<script src="/static/js/lienzo.js?v=4" defer></script>
{% else %}<span class="small muted">Aún no hay factores calificados.</span>{% endif %}{% endmacro %}
