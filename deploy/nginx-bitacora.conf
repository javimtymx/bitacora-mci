# /etc/nginx/sites-available/bitacora  (luego: ln -s ../sites-available/bitacora /etc/nginx/sites-enabled/)
# Certificado: sudo certbot --nginx -d mci.onecore.mx
limit_req_zone $binary_remote_addr zone=bitacora_login:10m rate=10r/m;

server {
    listen 80;
    server_name mci.onecore.mx;

    client_max_body_size 300m;  # respaldo sin S3; con S3 los archivos suben directo del navegador y no pasan por aquí
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /opt/bitacora-mci/app/static/;
        expires 7d;
    }

    location = /login {
        limit_req zone=bitacora_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # el diagnóstico con investigación profunda puede tardar
    }
}
